version: "3.8"

services:
  # ── Backend API (proxy vers Proxmox) ───────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pve-inventory-api
    restart: unless-stopped
    # Not published on the host: the frontend reaches it over the internal
    # Docker network via Nginx (/api). Expose only to linked services.
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Enforce strict TLS toward Proxmox (set to "false"/unset for self-signed)
      - PVE_TLS_INSECURE=${PVE_TLS_INSECURE:-true}
      # Restrict CORS in production, e.g. https://inventory.example.com
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-}
    networks:
      - pve-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Frontend (React + Nginx) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pve-inventory-ui
    restart: unless-stopped
    ports:
      - "${UI_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pve-net

networks:
  pve-net:
    driver: bridge
