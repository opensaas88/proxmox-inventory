services:
  # ── Backend API (proxy vers Proxmox) ───────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pve-inventory-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
    networks:
      - pve-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Frontend (React + Nginx) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pve-inventory-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UI_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pve-net

networks:
  pve-net:
    driver: bridge
